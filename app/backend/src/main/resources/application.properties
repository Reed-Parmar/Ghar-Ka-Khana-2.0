## MongoDB URI (defaults to local MongoDB). You can override by setting the MONGODB_URI environment variable.
spring.data.mongodb.uri=mongodb://localhost:27017/ghar_ka_khana
spring.data.mongodb.database=ghar_ka_khana

# If you don't have a local MongoDB running and want the app to start without session support,
# set store-type to 'none'. Note: repositories that access Mongo will still fail when used.
spring.session.store-type=none
frontend.origin=${FRONTEND_ORIGIN:http://localhost:3000}
server.port=8080

# JWT settings
jwt.secret=ReplaceThisWithAStrongSecretKey
jwt.expirationMs=3600000

# Logging
logging.level.org.springframework=INFO
spring.application.name=backend
